server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Trang chủ
    location = / {
        return 301 /TrangChu/;
    }

    location /TrangChu/ {
        try_files $uri $uri/ /TrangChu/index.html;
    }

    # Chi tiết sản phẩm
    location ~ ^/san-pham/([^/]+)/?$ {
        rewrite ^/san-pham/([^/]+)/?$ /san-pham/san-pham.html?slug=$1 last;
    }
    location /san-pham/ {
        try_files $uri $uri/ /san-pham/san-pham.html;
    }

    # Nhóm sản phẩm
    location ~ ^/nhom-sp/([^/]+)/?$ {
        rewrite ^/nhom-sp/([^/]+)/?$ /nhom-sp/nhom-san-pham.html?slug=$1 last;
    }
    location /nhom-sp/ {
        try_files $uri $uri/ /nhom-sp/nhom-san-pham.html;
    }

    # Tin tức
    location /tin-tuc/ {
        try_files $uri $uri/ /tin-tuc/tin-tuc.html;
    }

    # Các trang tĩnh khác
    location / {
        try_files $uri $uri/ =404;
    }

    gzip on;
    gzip_types text/css application/javascript;
}

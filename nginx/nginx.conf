events { worker_connections 1024; }
http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    gzip          on;

    server {
        listen 80 default_server;
        server_name _;

        location /admin {
            rewrite ^/admin/?(.*)$ /$1 break;
            proxy_pass http://techtra-admin:80;
            proxy_set_header Host techtra-admin;
            proxy_set_header X-Real-IP $remote_addr;
        }
        location /admin/assets/ {
            rewrite ^/admin/assets/?(.*)$ /assets/$1 break;
            proxy_pass http://techtra-admin:80;
            proxy_set_header Host techtra-admin;
            proxy_set_header X-Real-IP $remote_addr;
        }
        location /api {
            proxy_pass http://techtra-backend:5000;
            proxy_set_header Host techtra-backend;
            proxy_set_header X-Real-IP $remote_addr;
        }
        location / {
            proxy_pass http://techtra-shop:80;
            proxy_set_header Host techtra-shop;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
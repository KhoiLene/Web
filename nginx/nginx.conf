# nginx/nginx.conf — Reverse proxy điều hướng domain
events { worker_connections 1024; }

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    gzip          on;

    # ─── techtra.vn (shop khách hàng) ─────────────────────────────────────────
    server {
        listen 80;
        server_name techtra.vn www.techtra.vn;

        # Route /admin/* → techtra-admin container
        location /admin {
            proxy_pass         http://techtra-admin:80;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
        }

        # API requests → backend container
        location /api {
            proxy_pass         http://techtra-backend:5000;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
        }

        # Mọi route còn lại → techtra-shop container
        location / {
            proxy_pass         http://techtra-shop:80;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
        }
    }

    # ─── Server bằng IP (dùng khi test, VD: http://159.89.198.149) ────────────
    server {
        listen 80 default_server;

        # /admin → admin panel
        location /admin {
            proxy_pass         http://techtra-admin:80;
            proxy_set_header   Host $host;
        }

        # API requests → backend container
        location /api {
            proxy_pass         http://techtra-backend:5000;
            proxy_set_header   Host $host;
        }

        # / → shop
        location / {
            proxy_pass         http://techtra-shop:80;
            proxy_set_header   Host $host;
        }
    }
}

# techtra-admin/nginx.conf
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;

    # Asset phải trả đúng file thật (tránh load nhầm HTML => Syntax error manifest/loader)
    location ~* \.((js|css)(\?.*)?)$ {
        try_files $uri =404;
    }

    location ~* \.(json|manifest\.json)$ {
        try_files $uri =404;
    }

    # Tránh mọi request không phải asset quay về nginx welcome / index.html
    # (React routes thì mới fallback /index.html)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Nếu client gọi trực tiếp asset không tồn tại, trả 404 thay vì HTML
    location = /manifest.json { try_files $uri =404; }
    location = /loader.js { try_files $uri =404; }

}

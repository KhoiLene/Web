<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - Techtra Shop</title>
    <link rel="stylesheet" href="dangnhap.css">
</head>
<body>
    <div class="login-container">
        <div class="logo">
            <img src="AnhDangNhap.png" alt="Logo Đăng nhập">
        </div>
        <h2>Đăng nhập</h2>
        <form id="loginForm">
            <div class="input-group">
                <label for="username">Tên đăng nhập hoặc Email</label>
                <input type="text" id="username" name="username" required placeholder="Nhập tên đăng nhập hoặc email">
            </div>
            <div class="input-group">
                <label for="password">Mật khẩu</label>
                <input type="password" id="password" name="password" required placeholder="Nhập mật khẩu">
            </div>
            <button type="submit" class="btn-login">Đăng nhập</button>
            <div id="message" class="message"></div>
            <p class="register-link">
                Chưa có tài khoản? <a href="/DangKy/dangky.html">Đăng ký ngay</a>
            </p>
        </form>
    </div>
    <script src="dangnhap.js"></script>
</body>
</html>

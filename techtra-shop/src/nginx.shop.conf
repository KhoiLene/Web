# techtra-shop/nginx.conf
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Route /san-pham/* trả về san-pham.html
    location /san-pham/ {
        try_files $uri /san-pham.html;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript;
}

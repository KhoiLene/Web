<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Khách hàng - Techtra</title>
    <link rel="stylesheet" href="/components/khach-hang/khach-hang.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="header-placeholder"></div>

    <main class="customer-page container">
      <div class="customer-header">
        <h1>Khách hàng</h1>
        <p class="customer-subtitle">Thông tin hồ sơ, lịch sử mua hàng và chương trình khách thân thiết.</p>
      </div>

      <div class="customer-layout">
        <section class="customer-left">
          <div class="panel">
            <div class="panel-title">
              <i class="fa-regular fa-user"></i>
              <h2>Hồ sơ</h2>
            </div>

            <div class="account-actions">
              <a class="btn btn-ghost" href="/components/quen-mk/index.html">
                <i class="fa-solid fa-lock"></i> Đổi / đặt lại mật khẩu
              </a>
            </div>

            <form id="profileForm" class="form-grid">
              <div class="field">
                <label for="customerName">Họ tên</label>
                <input id="customerName" type="text" placeholder="Nhập họ tên" />
              </div>
              <div class="field">
                <label for="customerPhone">Số điện thoại</label>
                <input id="customerPhone" type="text" placeholder="Nhập số điện thoại" />
              </div>
              <div class="field">
                <label for="customerEmail">Email</label>
                <input id="customerEmail" type="email" placeholder="Nhập email" />
              </div>
              <div class="field field--full">
                <label for="customerAddress">Địa chỉ</label>
                <input id="customerAddress" type="text" placeholder="Nhập địa chỉ" />
              </div>

              <div class="form-actions">
                <button class="btn btn-primary" type="submit">Lưu thay đổi</button>
              </div>

              <div id="profileMessage" class="form-message" aria-live="polite"></div>
            </form>
          </div>
        </section>

        <section class="customer-right">
          <div class="panel panel--stack">
            <div class="panel-title">
              <i class="fa-solid fa-receipt"></i>
              <h2>Lịch sử mua hàng</h2>
            </div>
            <div id="ordersMount" class="history-list"></div>
            <div class="muted" id="ordersEmpty" style="display:none">Chưa có đơn hàng.</div>
          </div>

          <div class="panel panel--stack">
            <div class="panel-title">
              <i class="fa-solid fa-crown"></i>
              <h2>Khách thân thiết</h2>
            </div>
            <div class="loyalty-summary">
              <div class="loyalty-row">
                <span>Rank</span>
                <strong id="loyaltyRank">—</strong>
              </div>
              <div class="loyalty-row">
                <span>LTV</span>
                <strong id="loyaltyLtv">0 đ</strong>
              </div>
              <div class="loyalty-row">
                <span>Tổng đơn</span>
                <strong id="loyaltyOrders">0</strong>
              </div>
            </div>

            <div class="voucher-block">
              <h3>Voucher</h3>
              <div id="vouchersMount" class="voucher-list"></div>
              <div class="muted" id="vouchersEmpty" style="display:none">Chưa có voucher.</div>
            </div>
          </div>
        </section>
      </div>

      <div class="login-cta" id="loginCta" style="display:none">
        <i class="fa-solid fa-circle-info"></i>
        <p>Bạn cần đăng nhập để xem lịch sử và voucher.</p>
        <a class="btn btn-primary" href="/components/dang-nhap/dangnhap.html">Đăng nhập</a>
      </div>
    </main>

    <div id="footer-placeholder"></div>

    <script src="/components/tin-tuc/partials.js?v=3"></script>
    <script type="module" src="/components/khach-hang/khach-hang.js?v=1"></script>
  </body>
</html>
